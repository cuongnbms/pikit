# pnpm settings for this repo (single package — no `packages:` key needed).
#
# minimumReleaseAge: refuse to install any package version published less than
# N minutes ago. 10080 = 7 days. Guards against freshly-published compromised
# releases, which are typically yanked within a day or two.
#
# Escape hatch: add "<pkg>@<version>" entries to minimumReleaseAgeExclude when
# you genuinely need a version that was just published.
minimumReleaseAge: 10080
# Explicitly selected dev API baseline; keep the age gate for unrelated releases.
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.99.1'
  - '@earendil-works/pi-agent-core@0.99.1'
  - '@earendil-works/pi-ai@0.99.1'
  - '@earendil-works/pi-codemode@0.99.1'
  - '@earendil-works/pi-coding-agent@0.99.1'
  - '@earendil-works/pi-mcp@0.99.1'
  - '@earendil-works/pi-telemetry@0.99.1'
  - '@earendil-works/pi-tui@0.99.1'

# Keep transitive dev install scripts blocked explicitly, so pnpm does not
# treat them as unreviewed builds. esbuild uses its platform optional binary;
# typechecking and extension regression tests do not need its install script.
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
